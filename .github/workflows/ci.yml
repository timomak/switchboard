name: macOS checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Account and provider regression tests
        run: |
          cargo test --locked --lib codex_account::
          cargo test --locked --lib codex_provider::
          cargo test --locked --lib claude_connection::
          cargo test --locked --lib claude_desktop::
          cargo test --locked --lib chat_sync::
          cargo test --locked --lib library_sync::
      - run: ./macos/run-tests.sh
      - run: ./macos/bundle.sh
